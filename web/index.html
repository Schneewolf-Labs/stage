<!doctype html>
<html><head><meta charset="utf-8"><title>stage</title>
<style>
 html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:14px system-ui;color:#eee}
 body.opaque{background:#1a1023}
 canvas{display:block}
 /* Widgets: boxes as fractions of the canvas (left/top/width/height %), placed by widgets.js. */
 #capbox{position:fixed;z-index:4;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
 #caption{max-width:100%;box-sizing:border-box;background:#000c;color:#fff;
   padding:10px 18px;border-radius:12px;font-size:22px;line-height:1.3;text-align:center;display:none}
 #status{position:fixed;left:12px;top:12px;color:#af87ff;font-size:12px;opacity:.8;white-space:pre}
 #status.hidden{display:none}
 #screen{position:fixed;z-index:3;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
   opacity:0;transition:opacity .35s;pointer-events:none}
 #screen.on{opacity:1}
 #screen img{display:block;max-width:100%;max-height:calc(100% - 30px);object-fit:contain;border-radius:14px;
   box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12)}
 #screen figcaption{margin-top:8px;text-align:center;font-size:16px;color:#fff;text-shadow:0 1px 4px #000}
 #frames iframe{position:fixed;z-index:2;border:0;background:transparent;pointer-events:none}
 /* Edit mode (console preview): an outline per widget, drag to move, the corner to resize. */
 .wedit{position:fixed;z-index:50;box-sizing:border-box;outline:2px dashed #ff8fc8b0;outline-offset:-2px;cursor:move;touch-action:none}
 .wedit b{position:absolute;left:0;top:0;font:600 11px system-ui;background:#ff8fc8;color:#1a1023;padding:1px 6px;border-radius:0 0 6px 0}
 .wedit i{position:absolute;right:0;bottom:0;width:14px;height:14px;background:#ff8fc8;border-radius:3px 0 0 0;cursor:nwse-resize}
</style></head><body>
<div id="frames"></div>
<figure id="screen"><img alt=""><figcaption></figcaption></figure>
<div id="capbox"><div id="caption"></div></div><div id="status"></div><div id="edit"></div>
<script src="libs/live2d.min.js"></script>
<script src="libs/live2dcubismcore.min.js"></script>
<script src="libs/pixi.min.js"></script>
<script src="libs/index.min.js"></script>
<script type="module" src="stage.js"></script>
</body></html>
